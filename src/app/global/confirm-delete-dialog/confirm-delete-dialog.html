<h2 mat-dialog-title>{{data.title}}</h2>
<mat-divider></mat-divider>

<mat-dialog-content style="height: 100px; display: flex; align-items: center; justify-content: center;">
    Are you sure you want to delete this {{data.entityName}} ?
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton="outlined" (click)="closeDialog()">Cancel</button>
  <!-- The mat-dialog-close directive optionally accepts a value as a result for the dialog. -->
  <button matButton="filled" class="danger" (click)="onConfirm()">Delete</button>
</mat-dialog-actions>
