<mat-card>
    <mat-card-header>
        <mat-card-title><h2>{{objectType()}} audits</h2></mat-card-title>
    </mat-card-header>
    <table mat-table [dataSource]="entityAuditDatas" class="mat-elevation-z8 custom-header">
        <!-- Name Column -->
        <ng-container [matColumnDef]="objectType()">
            <th mat-header-cell *matHeaderCellDef> {{objectType()}} </th>
            <td mat-cell *matCellDef="let element"> {{element.objectStr}} </td>
        </ng-container>

        <ng-container matColumnDef="Audit action">
            <th mat-header-cell *matHeaderCellDef> Audit action </th>
            <td mat-cell *matCellDef="let element"> 
                {{element.operationType}} 
            </td>
        </ng-container>
        <ng-container matColumnDef="User">
            <th mat-header-cell *matHeaderCellDef> User </th>
            <td mat-cell *matCellDef="let element"> 
                {{element.user}} 
            </td>
        </ng-container>
        <ng-container matColumnDef="Datetime">
            <th mat-header-cell *matHeaderCellDef> Datetime </th>
            <td mat-cell *matCellDef="let element"> 
                {{element.operationDatetime | date:'yyyy-MM-dd HH:mm:ss'}} 
            </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
</mat-card>
