<mat-card class="form-card" appearance="outlined">
  <mat-card-header>
    <mat-card-title>Bus</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>Serial number</mat-label>
      <input [formField]="busForm.serialNumber" matInput>
        @for (error of busForm.serialNumber().errors(); track error) {
          <mat-error>{{ error.message }}</mat-error>
        }
      <mat-hint>&nbsp;</mat-hint>
    </mat-form-field>
    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>Brand</mat-label>
      <input [formField]="busForm.brand" matInput>
        @for (error of busForm.brand().errors(); track error) {
          <mat-error>{{ error.message }}</mat-error>
        }
      <mat-hint>&nbsp;</mat-hint>
    </mat-form-field>
    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>Capacity</mat-label>
      <input type="number" [formField]="busForm.capacity" matInput>
        @for (error of busForm.capacity().errors(); track error) {
          <mat-error>{{ error.message }}</mat-error>
        }
      <mat-hint>&nbsp;</mat-hint>
    </mat-form-field>
    <mat-card-actions [align]="'end'">
      <button matButton="filled" (click)="submit()">Create</button>
    </mat-card-actions>
  </mat-card-content>
</mat-card>
