@if (busesResp$ | async; as state) {
    @if (state.errorType == null) {
        <mat-card>
            <mat-card-header>
                <mat-card-title><h2>Buses List</h2></mat-card-title>
            </mat-card-header>
            <table mat-table [dataSource]="state.data!" class="mat-elevation-z8 custom-header">
                <ng-container matColumnDef="Serial Number">
                    <th mat-header-cell *matHeaderCellDef> Serial Number </th>
                    <td mat-cell *matCellDef="let element"> {{element.serialNumber}} </td>
                </ng-container>

                <ng-container matColumnDef="Brand">
                    <th mat-header-cell *matHeaderCellDef> Brand </th>
                    <td mat-cell *matCellDef="let element"> {{element.brand}} </td>
                </ng-container>

                <ng-container matColumnDef="Capacity">
                    <th mat-header-cell *matHeaderCellDef> Capacity </th>
                    <td mat-cell *matCellDef="let element"> {{element.capacity}} </td>
                </ng-container>

                <ng-container matColumnDef="Usable">
                    <th mat-header-cell *matHeaderCellDef> Usable </th>
                    <td mat-cell *matCellDef="let element"> 
                        <mat-checkbox [checked]="element.usable" disabled></mat-checkbox>
                    </td>
                </ng-container>

                <ng-container matColumnDef="Options">
                    <th mat-header-cell *matHeaderCellDef> Options </th>
                    <td mat-cell *matCellDef="let element"> 
                        <div class="icons-option-block">
                            <button matMiniFab (click)="editItem(element)">
                                <mat-icon>edit</mat-icon>
                            </button>

                            <button matMiniFab class="danger" (click)="deleteItem(element.id)" aria-label="Delete">
                                <mat-icon>delete</mat-icon>
                            </button>
                        </div>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>
        </mat-card>
        
    }
}

@else {
    
}
