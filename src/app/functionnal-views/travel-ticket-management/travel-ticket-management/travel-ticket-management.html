@if(state$ | async; as state) {
    @if (state.agencies.errorType == null && state.paymentMethods.errorType == null) {
      <app-travel-ticket-table-list
        [agencies]="state.agencies.data!"
        [paymentMethods]="state.paymentMethods.data!"
      >
      </app-travel-ticket-table-list>

    }
}
