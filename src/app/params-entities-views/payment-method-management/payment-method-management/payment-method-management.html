@if (paymentMethodsDatas$ | async; as state) {
	@if (state.paymentMethods.errorType == null && state.paymentMethodAudits.errorType == null) {
		<div class="row">
			<div class="body-box col-50">
				<mat-accordion style="margin-bottom: 20px;">
					<mat-expansion-panel (opened)="formOpenState.set(true)" (closed)="formOpenState.set(false)">
						<mat-expansion-panel-header>
							<mat-panel-title> Create new payment method </mat-panel-title>
						</mat-expansion-panel-header>
						<div class="flex justify-content-center">
							<app-payment-method-form></app-payment-method-form>
						</div>
					</mat-expansion-panel>
				</mat-accordion>
				<app-payment-method-table-list [paymentMethods]="state.paymentMethods.data!">

				</app-payment-method-table-list>
			</div>
			<div class="col-50">
				<app-audit-history
					[objectType]="'Payment method'"
					[entityObjects]="state.paymentMethods.data!"
					[entityAudits]="state.paymentMethodAudits.data!"
				>
				</app-audit-history>
			</div>
		</div>
	}
}
