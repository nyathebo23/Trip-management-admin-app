<mat-card>
    <mat-card-header>
        <mat-card-title><h2>Agencies List</h2></mat-card-title>
    </mat-card-header>
    <table mat-table [dataSource]="agencies()" class="mat-elevation-z8 custom-header">
        <!-- Name Column -->
        <ng-container matColumnDef="Location description">
            <th mat-header-cell *matHeaderCellDef> Location Description </th>
            <td mat-cell *matCellDef="let element"> {{element.locationDesc}} </td>
        </ng-container>

        <ng-container matColumnDef="Quarter">
            <th mat-header-cell *matHeaderCellDef> Quarter </th>
            <td mat-cell *matCellDef="let element"> {{element.quarter}} </td>
        </ng-container>

        <ng-container matColumnDef="City">
            <th mat-header-cell *matHeaderCellDef> City </th>
            <td mat-cell *matCellDef="let element"> {{element.city.name }} </td>
        </ng-container>

        <ng-container matColumnDef="Options">
            <th mat-header-cell *matHeaderCellDef> Options </th>
            <td mat-cell *matCellDef="let element"> 
                <div class="icons-option-block">
                    <button matMiniFab (click)="editItem(element)">
                        <mat-icon>edit</mat-icon>
                    </button>

                    <button matMiniFab class="danger" (click)="deleteItem(element.id)" aria-label="Delete">
                        <mat-icon>delete</mat-icon>
                    </button>
                </div>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
</mat-card>
