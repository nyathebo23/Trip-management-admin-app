<h2 mat-dialog-title>Edit City</h2>
<mat-divider></mat-divider>

<mat-dialog-content>
    @if(errorMessage()) {
        <div class="form-post-error">
            {{ errorMessage() }}
        </div>
    }
    @if(isSubmitting()) {
        <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    }
    <mat-form-field appearance="outline" style="width: 100%;">
      <mat-label>Name</mat-label>
      <input [formField]="cityForm.name" matInput placeholder="Placeholder">
      @for (error of cityForm.name().errors(); track error) {
          <mat-error>{{ error.message }}</mat-error>
      }
    </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton="outlined" (click)="closeDialog()">Cancel</button>
  <button matButton="filled" class="secondary" [disabled]="cityForm().invalid()" (click)="submit()">
    Update
</button>
</mat-dialog-actions>
