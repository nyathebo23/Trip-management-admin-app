<mat-card class="form-card" appearance="outlined">
  <mat-card-header>
    <mat-card-title>City creation</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    @if(errorMessage()) {
        <div class="form-post-error">
            {{ errorMessage() }}
        </div>
    }
    @if(isSubmitting()) {
        <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    }
    <mat-form-field appearance="outline" style="width: 100%;">
      <mat-label>Name</mat-label>
      <input [formField]="cityForm.name" matInput placeholder="Name of the city">
      @for (error of cityForm.name().errors(); track error) {
          <mat-error>{{ error.message }}</mat-error>
      }
    </mat-form-field>
    <mat-card-actions>
      <button matButton="filled" [disabled]="cityForm().invalid()" (click)="submit()">Create</button>
    </mat-card-actions>
  </mat-card-content>

</mat-card>
