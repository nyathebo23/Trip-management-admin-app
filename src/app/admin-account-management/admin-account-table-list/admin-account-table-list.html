@if (adminAccountsResp$ | async; as state) {
    @if (state.errorType == null) {
        <mat-card>
            <mat-card-header>
                <mat-card-title><h2>Admin Accounts List</h2></mat-card-title>
            </mat-card-header>
            <table mat-table [dataSource]="state.data!" class="mat-elevation-z8 custom-header">
                <!-- Name Column -->
                <ng-container matColumnDef="Username">
                    <th mat-header-cell *matHeaderCellDef> Username </th>
                    <td mat-cell *matCellDef="let element"> {{element.username}} </td>
                </ng-container>

                <ng-container matColumnDef="Firstname">
                    <th mat-header-cell *matHeaderCellDef> Firstname </th>
                    <td mat-cell *matCellDef="let element"> {{element.firstName}} </td>
                </ng-container>

                <ng-container matColumnDef="Lastname">
                    <th mat-header-cell *matHeaderCellDef> Lastname </th>
                    <td mat-cell *matCellDef="let element"> {{element.lastName}} </td>
                </ng-container>

                <ng-container matColumnDef="Role">
                    <th mat-header-cell *matHeaderCellDef> Role </th>
                    <td mat-cell *matCellDef="let element"> {{element.role}} </td>
                </ng-container>

                <ng-container matColumnDef="Options">
                    <th mat-header-cell *matHeaderCellDef> Options </th>
                    <td mat-cell *matCellDef="let element"> 
                        <div class="icons-option-block">
                            <button matMiniFab class="danger" (click)="deleteItem(element.id)" aria-label="Delete">
                                <mat-icon>delete</mat-icon>
                            </button>
                        </div>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>
        </mat-card>
        
    }
}

@else {
    
}
